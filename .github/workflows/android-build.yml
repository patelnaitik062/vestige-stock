name: Build Android APK
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test domain logic
        run: node --test tests/*.test.cjs
      - name: Build and lint
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Prepare unsigned APK for private signing
        run: |
          mkdir -p build-export
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-export/Vestige-Stock-1.1.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-export/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 build-export/Vestige-Stock-1.1.0-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build-export/Vestige-Stock-1.1.0-unsigned.apk > build-export/apk-metadata.txt
          sha256sum build-export/* > build-export/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Vestige-Stock-build
          path: build-export/
          if-no-files-found: error
          retention-days: 14
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android startup, storage, scanner and PDFs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb exec-out run-as com.naitik.vestigestock cat files/catalogue-products.png > app/build/outputs/androidTest-results/catalogue-products.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-test-results
          path: app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14
